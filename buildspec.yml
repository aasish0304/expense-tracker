version: 0.2

phases:
  pre_build:
    commands:
      - echo "Installing backend dependencies..."
      - cd backend
      - pip install -r requirements.txt
      - echo "Running Django tests..."
      - python manage.py test
      - cd ..
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 523741416022.dkr.ecr.eu-north-1.amazonaws.com

  build:
    commands:
      - echo "Build started on $(date)"
      - echo "Building backend Docker image..."
      - docker build -t expense-tracker-backend:latest ./backend
      - docker tag expense-tracker-backend:latest 523741416022.dkr.ecr.eu-north-1.amazonaws.com/expense-tracker-backend:latest

  post_build:
    commands:
      - echo "Pushing backend image to ECR..."
      - docker push 523741416022.dkr.ecr.eu-north-1.amazonaws.com/expense-tracker-backend:latest
      - echo "Build completed on $(date)"